syntax = "proto3";
package budget.v1;
option go_package = "github.com/positron48/budget/gen/go/budget/v1;budgetv1";
import "google/protobuf/timestamp.proto";
import "budget/v1/investment.proto";
import "budget/v1/market_data.proto";

message InvestmentNAVSeries {
 bool extension_limited = 7;
 string key = 1;
 repeated string ledger_ids = 2;
 string currency = 3;
 string fx_policy_key = 4;
 string from_date = 5;
 string to_date = 6;
}
message InvestmentNAVIssue { string component_id = 1; string code = 2; }
message InvestmentNAVAmount {
 string numerator = 1;
 string denominator = 2;
 string decimal = 3; // display value rounded to 12 fractional digits; exact fraction above
}
message InvestmentNAVPoint {
 string date = 1; // Europe/Moscow reporting date
 string state = 2; // ready, incomplete, stale, unavailable
 int64 generation = 3;
 google.protobuf.Timestamp computed_at = 4;
 InvestmentNAVAmount known_value = 5; // incomplete is a subtotal, never full NAV; absent when stale/unavailable
 repeated InvestmentNAVIssue issues = 6;
 repeated InvestmentNAVIssue warnings = 7;
 string currency = 8;
 string fx_policy = 9;
 google.protobuf.Timestamp as_of = 10;
}
message ListInvestmentNAVSeriesRequest { string after_key = 1; }
message ListInvestmentNAVSeriesResponse {
 repeated InvestmentNAVSeries series = 1;
 string next_after_key = 2; // up to 100 per page
}
message GetInvestmentNAVHistoryRequest { string series_key = 1; string from_date = 2; string to_date = 3; }
message GetInvestmentNAVHistoryResponse { repeated InvestmentNAVPoint points = 1; string reporting_timezone = 2; }
message RequestInvestmentNAVRefreshRequest { string series_key = 1; }
message RequestInvestmentNAVRefreshResponse { string state = 1; } // requested, not calculated
service InvestmentNAVService {
 rpc GetTrackerInstrumentPrices(GetTrackerInstrumentPricesRequest) returns (GetTrackerInstrumentPricesResponse);
 rpc GetTrackerChart(GetTrackerChartRequest) returns (GetTrackerChartResponse);
 rpc GetTrackerHistory(GetTrackerHistoryRequest) returns (GetTrackerHistoryResponse);
 rpc GetTrackerContributions(GetTrackerContributionsRequest) returns (GetTrackerContributionsResponse);
 // The cashless tracker and recorded-journal APIs share the financial result format; history_scope identifies the model.
 // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
 // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
 rpc GetTrackerPerformance(GetTrackerPerformanceRequest) returns (GetInvestmentPerformanceResponse);
 rpc GetInvestmentLots(GetInvestmentLotsRequest) returns (GetInvestmentLotsResponse);
 rpc GetInvestmentCurrentNAV(GetInvestmentCurrentNAVRequest) returns (GetInvestmentCurrentNAVResponse);
 rpc GetInvestmentNAVVariant(GetInvestmentNAVVariantRequest) returns (GetInvestmentNAVVariantResponse);
 rpc PrepareInvestmentNAVVariant(PrepareInvestmentNAVVariantRequest) returns (PrepareInvestmentNAVVariantResponse);
 rpc ExportInvestmentSeries(ExportInvestmentSeriesRequest) returns (ExportInvestmentSeriesResponse);
 rpc GetInvestmentOverview(GetInvestmentOverviewRequest) returns (GetInvestmentOverviewResponse);
 rpc GetInvestmentProfit(GetInvestmentProfitRequest) returns (GetInvestmentProfitResponse);
 rpc ListInvestmentBenchmarks(ListInvestmentBenchmarksRequest) returns (ListInvestmentBenchmarksResponse);
 rpc GetInvestmentBenchmarkComparison(GetInvestmentBenchmarkComparisonRequest) returns (GetInvestmentBenchmarkComparisonResponse);
 // Shared result format with GetTrackerPerformance; keep the existing wire contract.
 // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
 rpc GetInvestmentPerformance(GetInvestmentPerformanceRequest) returns (GetInvestmentPerformanceResponse);
 rpc GetInvestmentNAVSeries(GetInvestmentNAVSeriesRequest) returns (GetInvestmentNAVSeriesResponse);
 rpc GetInvestmentInstrumentPrices(GetInvestmentInstrumentPricesRequest) returns (GetInvestmentInstrumentPricesResponse);
 rpc GetInvestmentPositions(GetInvestmentPositionsRequest) returns (GetInvestmentPositionsResponse);
 rpc GetInvestmentInstrument(GetInvestmentInstrumentRequest) returns (GetInvestmentInstrumentResponse);
 rpc GetInvestmentCompositionHistory(GetInvestmentCompositionHistoryRequest) returns (GetInvestmentCompositionHistoryResponse);
 rpc GetInvestmentGroups(GetInvestmentGroupsRequest) returns (GetInvestmentGroupsResponse);
 rpc SaveInvestmentGroups(SaveInvestmentGroupsRequest) returns (SaveInvestmentGroupsResponse);
 rpc SaveInvestmentPortfolio(SaveInvestmentPortfolioRequest) returns (SaveInvestmentPortfolioResponse);
 rpc ListInvestmentPortfolios(ListInvestmentPortfoliosRequest) returns (ListInvestmentPortfoliosResponse);
 rpc ListInvestmentValuationProfiles(ListInvestmentValuationProfilesRequest) returns (ListInvestmentValuationProfilesResponse);
 rpc ListInvestmentNAVSeries(ListInvestmentNAVSeriesRequest) returns (ListInvestmentNAVSeriesResponse);
 rpc GetInvestmentNAVHistory(GetInvestmentNAVHistoryRequest) returns (GetInvestmentNAVHistoryResponse);
 rpc RequestInvestmentNAVRefresh(RequestInvestmentNAVRefreshRequest) returns (RequestInvestmentNAVRefreshResponse);
 rpc GetInvestmentExchangeRates(GetInvestmentExchangeRatesRequest) returns (GetInvestmentExchangeRatesResponse);
 rpc GetInvestmentQuotes(GetInvestmentQuotesRequest) returns (GetInvestmentQuotesResponse);
}


message InvestmentPortfolio {
 // Reference-only saved account selection; no valuation series or copied positions.
 bool tracker_selection = 14;
 bool auto_extend = 13;
 bool archived = 12;
 string id = 1;
 string name = 2;
 repeated string ledger_ids = 3;
 string currency = 4;
 string fx_policy_key = 5;
 string convention_key = 6;
 string from_date = 7;
 string to_date = 8;
 string series_key = 9;
 int64 version = 10;
 google.protobuf.Timestamp updated_at = 11;
}
message SaveInvestmentPortfolioRequest {
 bool tracker_selection = 13;
 bool auto_extend = 12;
 bool archived = 11;
 string id = 1;
 string name = 2;
 repeated string ledger_ids = 3;
 string currency = 4;
 string fx_policy_key = 5;
 string convention_key = 6;
 string from_date = 7;
 string to_date = 8;
 int64 expected_version = 9;
 string request_key = 10;
}
message SaveInvestmentPortfolioResponse { InvestmentPortfolio portfolio = 1; }
message ListInvestmentPortfoliosRequest { string after_id = 1; }
message ListInvestmentPortfoliosResponse { repeated InvestmentPortfolio portfolios = 1; string next_after_id = 2; }
message InvestmentValuationProfileOption { string key = 1; string title = 2; string mode = 3; int64 version = 4; }
message ListInvestmentValuationProfilesRequest { string after_price_key = 1; string after_fx_key = 2; }
message ListInvestmentValuationProfilesResponse {
 repeated InvestmentValuationProfileOption price_profiles = 1;
 repeated InvestmentValuationProfileOption fx_profiles = 2;
 string next_price_key = 3;
 string next_fx_key = 4;
}
message GetInvestmentNAVSeriesRequest { string series_key = 1; }
message GetInvestmentNAVSeriesResponse { InvestmentNAVSeries series = 1; }

message GetInvestmentPerformanceRequest { string series_key = 1; string from_date = 2; string to_date = 3; }
message InvestmentTWRPoint {
 string date = 1;
 string state = 2;
 string reason = 3;
 int32 segment = 4;
 InvestmentNAVAmount daily_return = 5; // fraction: 0.02 means 2%
 InvestmentNAVAmount segment_return = 6;
 InvestmentNAVAmount index = 7; // 100 at each independent segment baseline
}
message GetInvestmentPerformanceResponse {
 string from_date = 1;
 string to_date = 2;
 string currency = 3;
 string fx_policy_key = 4;
 int64 generation = 5;
 InvestmentNAVAmount profit = 6;
 InvestmentNAVAmount net_contributions = 7;
 string reason = 8;
 InvestmentNAVAmount twr = 9;
 string twr_reason = 10;
 repeated InvestmentTWRPoint twr_points = 11;
 optional double xirr = 12; // annual fraction; absent means undefined, not zero
 string xirr_reason = 13;
 int32 xirr_days = 14;
 bool xirr_annualized = 15;
 string twr_convention = 16;
 string reporting_timezone = 17;
 string net_contributions_reason = 19;
 repeated TrackerBenchmarkLine tracker_benchmarks = 20;
 repeated TrackerAnalyticsPoint analytics_points = 21;
 repeated TrackerAnalyticsPeriod monthly_profit = 22;
 repeated TrackerAnalyticsPeriod yearly_profit = 23;
 string analytics_convention = 24;
 repeated string instrument_keys = 25; int64 classification_version = 26; bool monetary_only = 27; repeated string group_ids = 28;
 string history_scope = 18; // recorded_journal, not broker reconciliation certification
}

// Price-only public comparisons; never an unlabeled index/ETF substitution.
message TrackerBenchmarkPoint { string date = 1; InvestmentNAVAmount index = 2; string reason = 3; InvestmentNAVAmount virtual_value = 4; string virtual_reason = 5; InvestmentNAVAmount virtual_profit = 6; }
message TrackerBenchmarkLine {
 string key = 1; string title = 2; string kind = 3; string native_currency = 4;
 string provider = 5; string source_url = 6; string base_date = 7; string reason = 8;
 google.protobuf.Timestamp read_at = 9; repeated TrackerBenchmarkPoint points = 10;
}

message InvestmentBenchmark {
 string key = 1;
 string title = 2;
 string kind = 3; // price_index or etf_price_proxy
 string native_currency = 4;
 int64 version = 5;
}
message ListInvestmentBenchmarksRequest { string after_key = 1; }
message ListInvestmentBenchmarksResponse { repeated InvestmentBenchmark benchmarks = 1; string next_after_key = 2; }
message GetInvestmentBenchmarkComparisonRequest {
 string series_key = 1; string benchmark_key = 2; string from_date = 3; string to_date = 4;
}
message InvestmentBenchmarkPoint {
 InvestmentNAVAmount portfolio_index = 15; // initial uninterrupted TWR segment, base 100
 string date = 1;
 string state = 2;
 string reason = 3;
 InvestmentNAVAmount index = 4;
 InvestmentNAVAmount value = 5;
 InvestmentNAVAmount units = 6;
 InvestmentNAVAmount cash = 7;
 InvestmentNAVAmount pending_withdrawal = 8;
 InvestmentNAVAmount portfolio_value = 9; // complete current NAV only
 repeated string issues = 10;
 string observation_id = 11;
 int64 observation_revision = 12;
 string calendar_id = 13;
 int64 calendar_revision = 14;
}
message GetInvestmentBenchmarkComparisonResponse {
 InvestmentBenchmark benchmark = 1;
 string currency = 2;
 string fx_policy_key = 3;
 int64 generation = 4;
 int64 price_profile_version = 5;
 string reason = 6;
 repeated InvestmentBenchmarkPoint points = 7;
 string method = 8;
 string reporting_timezone = 9;
}

message InvestmentGroup { string id = 1; string name = 2; }
message InvestmentGroupMembership { string ledger_id = 1; string instrument_key = 2; string group_id = 3; }
message InvestmentGroups { int64 version = 1; repeated InvestmentGroup groups = 2; repeated InvestmentGroupMembership memberships = 3; }
message InvestmentGroupPosition { string ledger_id = 1; string ledger_name = 2; string instrument_key = 3; }
message GetInvestmentGroupsRequest {}
message GetInvestmentGroupsResponse { InvestmentGroups classification = 1; repeated InvestmentGroupPosition positions = 2; }
message SaveInvestmentGroupsRequest { InvestmentGroups classification = 1; string request_key = 2; string reason = 3; }
message SaveInvestmentGroupsResponse { InvestmentGroups classification = 1; }

// Classification is the current tenant structure for every requested date.
message GetInvestmentCompositionHistoryRequest {
 string series_key = 1; string from_date = 2; string to_date = 3;
 repeated string group_ids = 4; // empty list = all securities; empty ID = ungrouped
 string breakdown_by = 5; // group (default), account, currency, type
}
message InvestmentCompositionPoint {
 string date = 1; string state = 2;
 InvestmentNAVAmount securities_known = 3;
 bool securities_complete = 4;
 InvestmentNAVAmount cash_known = 5;
 bool cash_complete = 6;
 repeated InvestmentNAVIssue issues = 7;
}
message InvestmentCompositionSegment {
 string category_key = 6;
 string group_id = 1; string kind = 2;
 InvestmentNAVAmount known_value = 3;
 bool complete = 4;
 InvestmentNAVAmount weight = 5; // absent for incomplete, nonpositive, or negative composition
}
message GetInvestmentCompositionHistoryResponse {
 int64 classification_version = 1;
 string breakdown_by = 9;
 string currency = 2; string fx_policy_key = 3;
 repeated InvestmentCompositionPoint points = 4;
 repeated InvestmentCompositionSegment segments = 5; // last requested date only
 bool complete = 6;
 string reporting_timezone = 7;
 repeated InvestmentGroup groups = 8; // names from the same classification snapshot
}

message GetInvestmentPositionsRequest {
 string series_key = 1; string date = 2; repeated string group_ids = 3;
}
message InvestmentPositionPayment {
 string currency = 1;
 InvestmentNAVAmount gross = 2; InvestmentNAVAmount tax = 3; InvestmentNAVAmount net = 4;
}
message InvestmentPositionDetail {
 string ledger_id = 1; string ledger_name = 2; string instrument_key = 3; string group_id = 4;
 string quantity = 5; string book_currency = 6;
 string clean_cost = 7; string acquired_accrued = 8; // empty = unknown, zero is explicit
 string realized_clean = 9; string realized_accrued = 10;
 InvestmentNAVAmount value = 11; InvestmentNAVAmount weight = 12;
 InvestmentNAVAmount unrealized_clean = 13; InvestmentNAVAmount unrealized_dirty = 14;
 string price_currency = 15;
 InvestmentNAVAmount clean_price_per_security = 16;
 InvestmentNAVAmount accrued_per_security = 17;
 InvestmentNAVAmount dirty_price_per_security = 18;
 string provider_price = 19; string price_unit = 20;
 google.protobuf.Timestamp price_at = 21;
 string price_source = 22;
 string nominal = 23; string nominal_currency = 24;
 string lot_size = 25; string instrument_type = 26;
 repeated InvestmentPositionPayment payments = 27;
 repeated InvestmentNAVIssue issues = 28;
 MarketInstrument metadata = 29; // current descriptive catalog, not historical terms
 InvestmentNAVAmount historical_clean_cost = 30;
 InvestmentNAVAmount historical_acquired_accrued = 31;
 bool historical_clean_complete = 32;
 bool historical_accrued_complete = 33;
 repeated string historical_cost_reasons = 34;
}
message GetInvestmentPositionsResponse {
 string date = 1; string currency = 2; string fx_policy_key = 3;
 string valuation_state = 4;
 int64 classification_version = 5;
 repeated InvestmentPositionDetail positions = 6;
}
message GetInvestmentInstrumentRequest {
 string series_key = 1; string date = 2; string instrument_key = 3;
 string cursor = 4; repeated string group_ids = 5;
}
message GetInvestmentInstrumentResponse {
 google.protobuf.Timestamp as_of = 6;
 GetInvestmentPositionsResponse holdings = 1;
 MarketInstrument metadata = 2;
 repeated InvestmentOperation operations = 3;
 string next_cursor = 4;
 string instrument_key = 5;
}

message GetInvestmentInstrumentPricesRequest { string series_key = 1; string instrument_key = 2; string from_date = 3; string to_date = 4; repeated string group_ids = 5; }
message InvestmentAccruedEvidence {
 string source_id = 1; string instrument_id = 2; string currency = 3; string amount_per_unit = 4;
 google.protobuf.Timestamp from = 5; google.protobuf.Timestamp to = 6;
}
message InvestmentPriceAdjustmentEvidence {
 string source_price = 1; string multiplier = 2; string divisor = 3; string resolved_price = 4;
 string source_reference = 5; string evidence_sha256 = 6; string observation_hash = 7;
 string profile_key = 8; int64 profile_version = 9;
 string observation_id = 10; int64 observation_revision = 11;
 string basis = 12; string nominal = 13; string nominal_currency = 14;
}
message InvestmentInstrumentPricePoint {
 InvestmentPriceAdjustmentEvidence adjustment_evidence = 14;
 InvestmentAccruedEvidence accrued_evidence = 13;
 string date = 1; string state = 2; string native_currency = 3;
 InvestmentNAVAmount percent = 4;
 InvestmentNAVAmount native_clean = 5; InvestmentNAVAmount native_dirty = 6;
 InvestmentNAVAmount target_clean = 7; InvestmentNAVAmount target_dirty = 8;
 google.protobuf.Timestamp price_at = 9;
 string price_source = 10; string adjustment = 11;
 repeated InvestmentNAVIssue issues = 12;
}
message GetInvestmentInstrumentPricesResponse {
 repeated InvestmentOperation markers = 6;
 string instrument_key = 1; string currency = 2; string fx_policy_key = 3;
 int64 price_profile_version = 4;
 repeated InvestmentInstrumentPricePoint points = 5;
}

message InvestmentProfitPoint {
 string date=1;
 InvestmentNAVAmount daily=2;
 InvestmentNAVAmount cumulative=3;
 string daily_reason=4;
 string cumulative_reason=5;
}
message InvestmentProfitBucket {
 string period=1;
 string from_date=2;
 string to_date=3;
 InvestmentNAVAmount profit=4;
 InvestmentNAVAmount net_contributions=5;
 string reason=6;
}
message InvestmentProfitComponent {
 string kind=1;
 InvestmentNAVAmount known=2;
 bool complete=3;
 string reason=4;
 bool informational=5;
}
message InvestmentInstrumentContribution {
 string instrument_key=1;
 repeated string ledger_ids=2;
 bool closed=3;
 InvestmentNAVAmount known=4;
 bool complete=5;
 InvestmentNAVAmount share=6; // signed contribution / net portfolio profit; not portfolio weight or return
 repeated InvestmentProfitComponent components=7;
 MarketInstrument metadata=8;
}
message GetInvestmentProfitResponse {
 string series_key=1;
 string from_date=2;
 string to_date=3;
 string currency=4;
 string fx_policy_key=5;
 int64 generation=6;
 InvestmentNAVAmount profit=7;
 string reason=8;
 repeated InvestmentProfitPoint points=9;
 repeated InvestmentProfitBucket months=10;
 repeated InvestmentProfitBucket years=11;
 repeated InvestmentProfitComponent components=12;
 bool attribution_complete=13;
 string attribution_reason=14;
 string convention=15;
 repeated InvestmentInstrumentContribution instruments=16;
 bool instruments_complete=17;
 InvestmentProfitComponent instrument_remainder=18;
 string instrument_convention=19;
 InvestmentNAVAmount instrument_remainder_share=20;
}

message InvestmentOverviewFX {
 string from_currency = 1; string to_currency = 2;
 string policy_key = 3; int64 policy_version = 4;
 string source = 5; string mode = 6; string state = 7;
 InvestmentNAVAmount rate = 8; InvestmentNAVAmount change = 9;
 google.protobuf.Timestamp as_of = 10; google.protobuf.Timestamp available_at = 11;
 google.protobuf.Timestamp valid_until = 12; int64 revision = 13;
}
message GetInvestmentOverviewResponse {
 string series_key = 1;
 GetInvestmentPerformanceResponse performance = 2;
 InvestmentNAVPoint nav = 3;
 InvestmentNAVAmount securities_known = 4; bool securities_complete = 5;
 InvestmentNAVAmount cash_known = 6; bool cash_complete = 7;
 InvestmentNAVAmount daily_profit = 8; string daily_reason = 9;
 repeated InvestmentOverviewFX fx = 10;
 google.protobuf.Timestamp read_at = 11;
 string scope = 12; // full_registered_accounts, independent of group filters
 repeated InvestmentNAVIssue breakdown_issues = 13;
}

message ExportInvestmentSeriesResponse {
 string filename = 1;
 bytes data = 2; // gzip-compressed UTF-8 CSV, no partial exports
 string encoding = 3; // gzip
 string sha256 = 4; // uncompressed CSV
 int32 row_count = 5; // selected dates, excludes baseline row
 int64 uncompressed_size = 6;
 int64 generation = 7;
}

message InvestmentNAVVariantRequest {
 string source_series_key=1;
 string currency=2;
 string fx_policy_key=3;
}
message InvestmentNAVVariantResponse {
 InvestmentNAVSeries series=1;
 bool registered=2; // enabled target watch covers the entire source range
 int32 queued_days=3; // newly created jobs, not completed calculations
}

// Transient current snapshot; never a closed daily point or a return input.
message GetInvestmentCurrentNAVResponse {
 bool provisional=1;
 string series_key=2;
 string currency=3;
 repeated string ledger_ids=4;
 google.protobuf.Timestamp as_of=5;
 string last_completed_date=6;
 bool complete=7;
 InvestmentNAVAmount known_value=8;
 repeated InvestmentNAVIssue issues=9;
 repeated InvestmentNAVIssue warnings=10;
 int64 generation=11;
 string price_profile_key=12;
 int64 price_profile_version=13;
 string fx_policy=14;
 repeated InvestmentCurrentQuote quotes=15;
 repeated InvestmentCurrentFXLeg fx_legs=16;
}
message InvestmentCurrentQuote {
 string instrument_key=1;
 string state=2;
 string provider=3;
 string access_scope=4;
 string source_kind=5;
 string adjustment=6;
 string currency=7;
 string unit=8;
 InvestmentNAVAmount candidate_price=9; // may be expired; not used in NAV unless fresh
 google.protobuf.Timestamp price_at=10;
 google.protobuf.Timestamp received_at=11;
 google.protobuf.Timestamp valid_until=12;
 string observation_id=13;
 int64 revision=14;
 repeated string issues=15;
}
message InvestmentCurrentFXLeg {
 InvestmentNAVAmount observed_rate=11; // original from/to pair; inverse is explicit
 string native_currency=1;
 string id=2;
 int64 revision=3;
 string from_currency=4;
 string to_currency=5;
 string policy=6;
 bool inverse=7;
 google.protobuf.Timestamp as_of=8;
 google.protobuf.Timestamp available_at=9;
 google.protobuf.Timestamp valid_until=10;
}

message GetInvestmentLotsRequest {
 string series_key=1; string date=2; string instrument_key=3; string cursor=4; repeated string group_ids=5;
}
message InvestmentExactLot {
 string lot_id=6; string origin_ledger_id=7; int64 origin_sequence=8;
 string origin_id=1; google.protobuf.Timestamp acquired_at=2;
 InvestmentNAVAmount quantity=3; InvestmentNAVAmount clean_cost=4; InvestmentNAVAmount acquired_accrued=5;
}
message InvestmentLotChange {
 string ledger_id=7; int64 sequence=8; string ledger_name=9;
 string operation_id=1; string kind=2; string instrument_key=3; google.protobuf.Timestamp at=4;
 InvestmentExactLot before=5; InvestmentExactLot after=6;
}
message InvestmentLotDetail {
 string ledger_id=1; string ledger_name=2; string book_currency=3; InvestmentExactLot lot=4;
 InvestmentOperation origin=5;
 InvestmentNAVAmount historical_clean_cost=6; InvestmentNAVAmount historical_acquired_accrued=7;
 bool historical_clean_complete=8; bool historical_accrued_complete=9; repeated string reasons=10;
 InvestmentNAVAmount acquisition_fx_rate=11; google.protobuf.Timestamp acquisition_fx_cutoff=12;
 repeated InvestmentCurrentFXLeg fx_legs=13; repeated InvestmentLotChange changes=14;
}
message GetInvestmentLotsResponse {
 string date=1; string currency=2; string fx_policy_key=3; int32 total=4;
 repeated InvestmentLotDetail lots=5; string next_cursor=6;
}

// Dedicated RPC envelopes preserve the existing field numbers and wire payloads.
message GetInvestmentCurrentNAVRequest { string series_key = 1; }
message ExportInvestmentSeriesRequest { string series_key = 1; string from_date = 2; string to_date = 3; }
message GetInvestmentOverviewRequest { string series_key = 1; string from_date = 2; string to_date = 3; }
message GetInvestmentProfitRequest { string series_key = 1; string from_date = 2; string to_date = 3; }
message GetInvestmentNAVVariantRequest {
 string source_series_key=1;
 string currency=2;
 string fx_policy_key=3;
}
message PrepareInvestmentNAVVariantRequest {
 string source_series_key=1;
 string currency=2;
 string fx_policy_key=3;
}
message GetInvestmentNAVVariantResponse {
 InvestmentNAVSeries series=1;
 bool registered=2; // enabled target watch covers the entire source range
 int32 queued_days=3; // newly created jobs, not completed calculations
}
message PrepareInvestmentNAVVariantResponse {
 InvestmentNAVSeries series=1;
 bool registered=2; // enabled target watch covers the entire source range
 int32 queued_days=3; // newly created jobs, not completed calculations
}

// Reporting translation only; these rates never create broker cash movements.
message GetInvestmentExchangeRatesRequest {
 string fx_policy_key=1; string currency=2;
 repeated string from_currencies=3;
 repeated string dates=4; // Moscow dates; current rates are also returned with date=""
}
message InvestmentExchangeRate {
 string date=1; string from_currency=2; InvestmentNAVAmount rate=3; // absent when unavailable or expired
 // Current rows only: latest earlier observation of the same source pair/path.
 // Retrospective comparison, not a verified exchange session/publication time.
 InvestmentNAVAmount previous_rate=4;
 repeated InvestmentCurrentFXLeg previous_fx_legs=5;
}
message GetInvestmentExchangeRatesResponse {
 string currency=1; string fx_policy_key=2; int64 policy_version=3; string mode=4;
 google.protobuf.Timestamp read_at=5; repeated InvestmentExchangeRate rates=6;
 string source=7; string time_convention=8;
 repeated InvestmentCurrentFXLeg current_fx_legs=9; // Evidence for date="" rates only; never historical publication-time proof.
}

message GetInvestmentQuotesRequest { repeated string instrument_keys=1; }
message InvestmentQuote {
 string instrument_key=1; string currency=2; InvestmentNAVAmount clean_price=3;
 google.protobuf.Timestamp price_at=4; string source=5; string state=6;
 repeated string issues=7; int64 mapping_version=8;
 // Current descriptive provider metadata; never historical pricing terms.
 MarketInstrument instrument=9;google.protobuf.Timestamp metadata_at=10;
 // Raw clean quote, nominal used for its normalization and dated per-unit NKD.
 InvestmentNAVAmount raw_price=11;string raw_unit=12;
 InvestmentNAVAmount nominal=13;string nominal_currency=14;
 InvestmentNAVAmount accrued=15;google.protobuf.Timestamp accrued_at=16;
 // Latest saved close before the current UTC day; separate from live quotes.
 InvestmentNAVAmount previous_close=17;string previous_close_currency=18;google.protobuf.Timestamp previous_close_at=19;
}
message GetInvestmentQuotesResponse {
 google.protobuf.Timestamp read_at=1; repeated InvestmentQuote quotes=2;
}

message GetTrackerPerformanceRequest {
 repeated string ledger_ids=1;
 string currency=2;
 string fx_policy_key=3;
 string from_date=4;
 string to_date=5;
 repeated string snapshot_tokens=6;
 repeated string group_ids=7; repeated string instrument_keys=8; bool monetary_only=9;
}
message GetTrackerHistoryRequest {
 bool compact_issues=12; // Chart quality codes/count; per-position diagnostics remain in detail_date.
 int32 page_days=11; // 0 = legacy 31 days; up to 93 days for chart loading.
 repeated string ledger_ids=1;
 string currency=2;
 string fx_policy_key=3;
 string from_date=4;
 string to_date=5;
 repeated string group_ids=7; // empty selection = all; empty ID = ungrouped
 string performance_from_date=6; // original range start, constant across pages
 string detail_date=10; // One-day breakdown; from/to retain the original chart basis.
 repeated string instrument_keys=8; bool monetary_only=9; // Group snapshots carry own monetary flows, never group TWR/XIRR.
}
message TrackerValueDetail {
 string ledger_id=1; string ledger_name=2; string instrument_key=3; string native_currency=4;
 InvestmentNAVAmount quantity=5; InvestmentNAVAmount unit_price=6; InvestmentNAVAmount native_value=7;
 InvestmentNAVAmount value=8; InvestmentNAVAmount fx_rate=9;
 google.protobuf.Timestamp price_at=10; string price_source=11; int64 mapping_version=12;
 repeated string issues=13;
}
message TrackerHistoryPoint {
 int32 issue_count=11; // Full number before optional chart compaction.
 string date=1;
 string state=2;
 InvestmentNAVAmount known_value=3;
 repeated InvestmentNAVIssue issues=4;
 int32 priced_positions=5;
 int32 positions=6;
 string coverage_key=7;
 repeated TrackerValueDetail details=9; repeated InvestmentCurrentFXLeg fx_legs=10;
}
message GetTrackerHistoryResponse {
 repeated TrackerHistoryPoint points=1;
 string next_date=2;
 int64 generation=3;
 string currency=4;
 string fx_policy_key=5;
 int64 fx_policy_version=6;
 string fx_mode=7;
 google.protobuf.Timestamp read_at=8;
 string price_convention=9;
 string reporting_timezone=10;
 string basis_key=11;
 string performance_snapshot=12; // short-lived signed data, not an auth token
 int64 classification_version = 13;
 repeated string instrument_keys=14; bool monetary_only=15; repeated string group_ids=16; bool details_included=17;
 repeated string analytics_instrument_keys=18; // Posted instruments within the selected scope.
 repeated string monetary_excluded_keys=20; // Unknown flows or unavailable end holdings; temporary earlier valuations remain gaps.
 repeated string analytics_excluded_keys=19; // Incomplete instrument histories in this page, including its baseline.
}

// Provider series for a card; no legacy NAV series or position is required.
message GetTrackerInstrumentPricesRequest {
 int32 page_days=10; // 0 = legacy 31 days; up to 93 days.
 string instrument_key=1;string currency=2;string fx_policy_key=3;string from_date=4;string to_date=5;
 string listing_id=6;string provider=7;string access_scope=8;string instrument_id=9;
}
message TrackerInstrumentListing {
 string id=1;MarketSourceKey source=2;string instrument_id=3;string kind=4;string currency=5;string unit=6;
 google.protobuf.Timestamp from=7;google.protobuf.Timestamp to=8;bool enabled=9;
}
message TrackerInstrumentPricePoint {
 string date=1;string state=2;string native_currency=3;string unit=4;
 InvestmentNAVAmount raw=5;InvestmentNAVAmount native_clean=6;InvestmentNAVAmount clean=7;
 InvestmentNAVAmount accrued=8;InvestmentNAVAmount native_dirty=9;InvestmentNAVAmount dirty=10;
 string source=11;string observation_id=12;int64 observation_revision=13;string candle_date=14;
 string nominal=15;string nominal_currency=16;repeated string issues=17;
}
message GetTrackerInstrumentPricesResponse {
 string instrument_key=1;string currency=2;string fx_policy_key=3;int64 fx_policy_version=4;string fx_mode=5;
 string next_date=6;string basis_key=7;google.protobuf.Timestamp read_at=8;
 repeated TrackerInstrumentListing listings=9;MarketInstrument instrument=10;google.protobuf.Timestamp metadata_at=11;
 InvestmentQuote quote=12;GetMarketBondFactsResponse bond=13;MarketSourceKey source=14;bool listing_only=15;
 repeated TrackerInstrumentPricePoint points=16;string price_convention=17;string reporting_timezone=18;bool bond_limited=19;string metadata_instrument_id=20;bool metadata_enabled=21;
}

message TrackerAnalyticsPoint {
 string date=1; InvestmentNAVAmount value=2; InvestmentNAVAmount flow=3;
 InvestmentNAVAmount contributions=4; InvestmentNAVAmount invested=5;
 InvestmentNAVAmount profit=6; InvestmentNAVAmount daily_profit=7;
 string reason=8; string flow_reason=9;
 // Lifetime cashless funding, independent of the displayed period. Purchases
 // and expenses add capital; sales and received payouts remove it.
 InvestmentNAVAmount recorded_capital=10; string recorded_capital_reason=11;
}
message TrackerAnalyticsPeriod {
 string key=1; string from_date=2; string to_date=3;
 InvestmentNAVAmount profit=4; string reason=5;
 // Known contribution of securities priced at both boundaries; never a full total.
 InvestmentNAVAmount known_profit=6; repeated string excluded_instrument_keys=7;
}

message GetTrackerContributionsRequest {
 repeated string ledger_ids=1; repeated string group_ids=2;
 string currency=3; string fx_policy_key=4; string from_date=5; string to_date=6; repeated string instrument_keys=7;
}
message TrackerContribution {
 string ledger_id=1; string ledger_name=2; string instrument_key=3;
 string group_id=4; string group_name=5; string reason=6;
 InvestmentNAVAmount opening=7; InvestmentNAVAmount closing=8;
 InvestmentNAVAmount flow=9; InvestmentNAVAmount profit=10;
 InvestmentNAVAmount opening_quantity=11; InvestmentNAVAmount closing_quantity=12;
 InvestmentNAVAmount profit_share=13; // Presentation fraction rounded to twelve decimals; absent for undefined/unbounded ratios.
 bool in_scope=14;
}
message GetTrackerContributionsResponse {
 string from_date=1; string to_date=2; string currency=3; string fx_policy_key=4;
 int64 fx_policy_version=5; string fx_mode=6; int64 classification_version=7;
 google.protobuf.Timestamp read_at=8; string basis_key=9; string convention=10;
 repeated TrackerContribution rows=11; InvestmentNAVAmount profit=12;
 InvestmentNAVAmount known_profit=13; string reason=14; repeated string instrument_keys=15; repeated string group_ids=16;
}

// Persisted daily projections. Snapshot capabilities are never persisted.
message GetTrackerChartRequest {
 repeated string ledger_ids = 1;
 repeated string group_ids = 2;
 repeated string instrument_keys = 3;
 string currency = 4;
 string fx_policy_key = 5;
 string from_date = 6;
 string to_date = 7;
}
message TrackerChartCalculation {
 repeated GetTrackerHistoryResponse pages = 1;
 GetInvestmentPerformanceResponse performance = 2;
}
message GetTrackerChartResponse {
