name: CI

on:
  push:
    branches: [ '**' ]
    tags: [ '*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  actions: read
  contents: read

jobs:
  investment-operations:
    name: Investment worker rollout and alerts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render inactive worker rollout
        run: kubectl kustomize deploy/investments > /tmp/investment-workers.yaml
      - name: Validate worker alert expressions and behavior
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/investments:/rules:ro" -w /rules prom/prometheus:v2.51.2 check rules worker-alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/investments:/rules:ro" -w /rules prom/prometheus:v2.51.2 test rules worker-alerts.test.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/investments:/rules:ro" -w /rules prom/prometheus:v2.51.2 check config --syntax-only prometheus-workers.yml
  proto:
    name: Protobuf and workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true
      - name: Install pinned Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.47.2
      - name: Lint all protobuf contracts
        working-directory: proto
        run: buf lint
      - name: Validate all GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint -shellcheck='' -pyflakes=''
      - name: Verify release source inventory boundaries
        run: |
          python3 -m unittest discover -s scripts/investments -p test_source_manifest.py -v
          python3 -m unittest discover -s scripts/investments -p test_ci_go_summary.py -v
  go:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.11.0
      - name: Tidy
        run: go mod tidy
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout=5m
      - name: Test
        run: |
          test_exit=0
          WORKER_METRICS_HTTP_TEST=1 go test ./... -race -coverprofile=coverage.out -covermode=atomic -json > go-test-results.jsonl 2>&1 || test_exit=$?
          cat go-test-results.jsonl
          python3 scripts/investments/ci_go_summary.py go-test-results.jsonl
          exit "$test_exit"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage.out
          path: |
            coverage.out
            go-test-results.jsonl
  postgres:
    name: PostgreSQL ${{ matrix.pg }} financial integration and full restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16]
    env:
      GOTOOLCHAIN: local
      PG_INTEGRATION: '1'
      PG_TEST_IMAGE: postgres:${{ matrix.pg }}-alpine
      BUDGET_BACKUP_TEST_IMAGE: postgres:${{ matrix.pg }}-alpine
      BUDGET_BACKUP_TEST_REPORT: ${{ github.workspace }}/full-backup-fixture-report.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true
      - name: Test financial persistence and real pg_dump/pg_restore
        run: |
          test_exit=0
          go test -race ./internal/adapter/postgres ./internal/adapter/pgbackup -run '^(TestInvestment|TestBroker|TestMarket|TestAssets|TestBudgetFullBackup|TestMigrationUpgrade|TestUpgradeRehearsal)' -count=1 -json > financial-test-results.jsonl 2>&1 || test_exit=$?
          cat financial-test-results.jsonl
          python3 scripts/investments/ci_go_summary.py financial-test-results.jsonl
          exit "$test_exit"
      - name: Test operator backup and restore through pod tools
        if: matrix.pg == 15
        env:
          BUDGET_OPERATOR_INTEGRATION: '1'
          BUDGET_BACKUP_BINARY: ${{ github.workspace }}/budgetbackup-operator-test
        run: |
          go build -o "$BUDGET_BACKUP_BINARY" ./cmd/budgetbackup
          python3 -m unittest discover -s scripts/investments -p test_production_backup.py -v 2>&1 | tee operator-backup-test.log
      - name: Save synthetic restore evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-backup-fixture-report-pg${{ matrix.pg }}
          path: |
            full-backup-fixture-report.json
            financial-test-results.jsonl
            operator-backup-test.log
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck all web sources and tests
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_GRPC_BASE_URL: http://127.0.0.1:3030/grpc
        run: npm run build
      - name: Test
        working-directory: web
        run: npm run test
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        working-directory: web
        run: npm run test:e2e
      - name: Read-only investment browser tests
        working-directory: web
        env:
          E2E_INVESTMENTS_READ_ONLY: "true"
        run: npx playwright test e2e/portfolio-tracker.spec.ts e2e/portfolio-accounts.spec.ts
      - name: Disabled investment browser tests
        working-directory: web
        env:
          E2E_INVESTMENTS_ENABLED: "false"
        run: npx playwright test e2e/investment-disabled.spec.ts
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-traces
          path: web/test-results
      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: web/.next
      # - name: Check coverage threshold
      #   run: |
      #     total=$(go tool cover -func=coverage.out | awk '/total:/ {print int($3)}')
      #     echo "Total coverage: ${total}%"
      #     if [ "$total" -lt 80 ]; then echo "coverage below 80%" && exit 1; fi

  fullstack:
    name: Authenticated local investment full stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real authenticated browser, restart and feature controls
        run: python3 scripts/investments/fullstack_smoke.py --out /tmp/budget-fullstack-evidence
      - name: Save synthetic fullstack evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: investment-fullstack-evidence
          path: |
            /tmp/budget-fullstack-evidence/*.log
            /tmp/budget-fullstack-evidence/report.json
          if-no-files-found: warn

  container-fullstack:
    name: Authenticated investment release containers (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build actual Dockerfiles and exercise financial persistence
        run: python3 scripts/investments/container_smoke.py --backend-platform linux/${{ matrix.arch }} --out /tmp/budget-container-evidence
      - name: Save synthetic container evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: investment-container-evidence-${{ matrix.arch }}
          path: |
            /tmp/budget-container-evidence/*.log
            /tmp/budget-container-evidence/report.json
          if-no-files-found: warn

  docker:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [go, web, postgres, proto, investment-operations, fullstack, container-fullstack, go-security, node-security, container-security]
    if: github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || github.ref_type == 'tag')
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: budget-app
            dockerfile: deploy/Dockerfile
            context: .
          - image_suffix: budget-web
            dockerfile: web/Dockerfile
            context: ./web
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_GRPC_BASE_URL=https://budget.qantrix.ru/grpc
            NEXT_PUBLIC_APP_URL=https://budget.qantrix.ru
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=624633128444-ri9echc52fpq9qm8qgcs1g6jp0u4pli3.apps.googleusercontent.com
            ENVOY_URL=http://budget-envoy:8081

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [go, web, postgres, proto, investment-operations, fullstack, container-fullstack, go-security, node-security, container-security]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build backend binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/budgetd-linux-amd64 ./cmd/budgetd
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${{ github.sha }}" -o dist/budgetd-linux-arm64 ./cmd/budgetd
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/budgetbackup-linux-amd64 ./cmd/budgetbackup
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/budgetbackup-linux-arm64 ./cmd/budgetbackup
          for command in investfxpolicy investcbr marketdata investmentnav investalphafx alphafx investmentarchive portfoliocandidate; do
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/$command-linux-amd64 ./cmd/$command
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/$command-linux-arm64 ./cmd/$command
          done
          chmod +x dist/*-linux-amd64 dist/*-linux-arm64
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_GRPC_BASE_URL: https://budget.qantrix.ru/grpc
          NEXT_PUBLIC_APP_URL: https://budget.qantrix.ru
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 624633128444-ri9echc52fpq9qm8qgcs1g6jp0u4pli3.apps.googleusercontent.com
          ENVOY_URL: http://budget-envoy:8081
        run: npm run build
      - name: Create frontend archive
        run: |
          mkdir -p dist-frontend
          cp -r web/.next/standalone/* dist-frontend/
          mkdir -p dist-frontend/.next
          cp -r web/.next/static dist-frontend/.next/static
          if [ -d web/.next/server ]; then cp -r web/.next/server dist-frontend/.next/server; fi
          cd web/.next
          find . -maxdepth 1 -type f -exec cp {} ../../dist-frontend/.next/ \;
          cd ../..
          if [ ! -f dist-frontend/package.json ]; then
            echo '{"name":"budget-frontend","version":"1.0.0","scripts":{"start":"node server.js"},"engines":{"node":">=20"}}' > dist-frontend/package.json
          fi
          if [ -d web/public ]; then cp -r web/public dist-frontend/public; fi
          cd dist-frontend && tar -czf ../dist/frontend-build.tar.gz . && cd ..
      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false

  go-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true
      - name: Install Go dependencies
        run: |
          go mod download
          go mod verify
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Run Go security audit
        run: govulncheck ./...

  node-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run npm audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check outdated packages
        working-directory: web
        run: npm outdated || true

  container-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Install verified Trivy 0.75.0
        run: |
          curl --fail --location --retry 3 --output /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  /tmp/trivy.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/trivy-bin
          tar -xzf /tmp/trivy.tar.gz -C /tmp/trivy-bin trivy
      - name: Require clean high and critical configuration scan
        run: /tmp/trivy-bin/trivy config --skip-check-update --severity HIGH,CRITICAL --exit-code 1 --format sarif --output trivy-config-results.sarif .
      - name: Upload Trivy config scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-config-results.sarif'
